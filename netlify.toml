[build]
  publish = "."

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://identity.netlify.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://buy.stripe.com https://identity.netlify.com https://api.netlify.com; frame-src 'self' https://buy.stripe.com https://*.stripe.com https://identity.netlify.com;"
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache assets aggressively
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Admin (Decap CMS) needs a looser CSP to load its bundle + Netlify Identity -
# scoped to /admin/* only, rest of the site keeps the strict policy above.
#
# blob: is required in connect-src, img-src and default-src. When an editor
# picks an image, Decap holds it as a blob URL and then does fetch(blobURL) to
# read the bytes back before committing. Without blob: in connect-src that
# fetch is blocked by CSP and Decap reports "Failed to persist entry:
# TypeError: Failed to fetch" - which is exactly what Will hit on 30 Jul 2026
# adding a logo to the member wheel. Text-only saves never touch a blob, which
# is why every other edit worked. Do not remove blob: from these three lists.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Content-Security-Policy = "default-src 'self' blob: https://unpkg.com https://identity.netlify.com https://api.netlify.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://identity.netlify.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' blob: data: https://api.netlify.com https://identity.netlify.com https://*.netlify.app https://api.github.com; worker-src 'self' blob:; frame-src 'self' https://identity.netlify.com;"

# Redirects
#
# Domain consolidation (4 Aug 2026): sctechia.au and www.sctechia.au are
# aliases on the same Netlify site, so without these rules they SERVE the site
# rather than pointing at it - two addresses showing identical content, which
# splits search ranking between them. These send both to the primary domain.
#
# force = true is required. Netlify normally lets a real file win over a
# redirect rule, and "/" matches index.html, so without force these never fire.
#
# Keep these FIRST: rules are matched in order, and a request to
# sctechia.au/membership should leave the domain before the path rules run.
[[redirects]]
  from = "https://sctechia.au/*"
  to = "https://sctechia.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.sctechia.au/*"
  to = "https://sctechia.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/join/"
  to = "/join.html"
  status = 200

[[redirects]]
  from = "/membership"
  to = "/join.html"
  status = 301

[[redirects]]
  from = "/become-a-member"
  to = "/join.html"
  status = 301

# Netlify Forms: configure notification emails in dashboard
# Dashboard > Forms > [form name] > Settings > Email notifications
# Add recipients: info@sctechia.com.au, hello@blueseas.ai
# Forms used: "membership" (join-form.html), "contact" (index.html), "speakers-panel" (index.html)
#
# Page structure (updated 25 Jul 2026 revision):
#   index.html      - homepage
#   join.html       - membership tiers / pricing overview (was previously tiers + form combined)
#   join-form.html  - NEW: separate registration form page, reads ?tier= from the
#                     "Join for $X" links on join.html to preselect the tier

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200
