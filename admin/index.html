<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>SCTechIA · Content Editor</title>
  <style>
    /* Shown only while the editor is loading - Decap replaces this once it mounts. */
    body { margin: 0; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: #F5F7F6; }
    .loading { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
    .loading .mark { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #2E8A90, #0088BE); display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .loading p { color: #5C6B6D; font-size: 14px; margin: 0; }
    .loading .spin { width: 20px; height: 20px; border: 3px solid #D7DEDC; border-top-color: #2E8A90; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading" id="loadingScreen">
    <div class="mark">🛠️</div>
    <div class="spin"></div>
    <p>Loading your editor&hellip;</p>
  </div>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
