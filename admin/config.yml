backend:
  name: git-gateway
  branch: main

# Six things are editable here: events, board members, membership pricing,
# member logos, the common questions and the event photos. Nothing else on
# the site (focus areas, hero copy, footer, nav) has a field here, so it
# cannot be touched through this admin panel.

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "events"
    label: "📅 Events"
    label_singular: "Event"
    description: "What's shown in the Upcoming Events section on the homepage."
    files:
      - file: "content/events.json"
        label: "📅 Upcoming Events"
        name: "events"
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            summary: "🎫 {{title}} · {{dateLabel}}"
            fields:
              - { label: "🎫 Event name", name: "title", widget: "string" }
              - { label: "📅 Date (as shown on the card)", name: "dateLabel", widget: "string", hint: "Type it exactly as you want it to read, e.g. '16 Sep 2026 • All day', 'Coming soon' or 'Quarterly • Evening'" }
              - { label: "🏷️ Tag", name: "tag", widget: "select", options: [{ label: "🤝 Networking", value: "Networking" }, { label: "🏆 Flagship", value: "Flagship" }] }
              - { label: "📝 Description", name: "description", widget: "text" }
              - { label: "📍 Location", name: "location", widget: "string", hint: "e.g. 'Sunshine Coast venue TBC'" }
              - { label: "🔗 More information link (Safe Tickets URL)", name: "moreInfoUrl", widget: "string", required: false, hint: "Leave blank if there's no ticket page yet" }

  - name: "board"
    label: "👥 Board Members"
    label_singular: "Board Member"
    description: "Who's shown in the Leadership section on the homepage."
    files:
      - file: "content/board.json"
        label: "👥 Board Members"
        name: "board"
        fields:
          - label: "Members"
            name: "members"
            widget: "list"
            summary: "🧑 {{name}} · {{role}}"
            fields:
              - { label: "📸 Photo", name: "photo", widget: "image" }
              - { label: "🧑 Full name", name: "name", widget: "string" }
              - { label: "🎖️ Role", name: "role", widget: "string", hint: "e.g. Chair, Vice Chair, Secretary, Treasurer, Board Member" }
              - { label: "🏢 Company / organisation", name: "company", widget: "string" }
              - { label: "📝 Short bio (optional)", name: "bio", widget: "text", required: false, pattern: ["^[\\s\\S]{0,130}$", "Too long. Keep the bio to 130 characters or fewer so it fits the card without being cut off."], hint: "One sentence, 130 characters maximum. Anything longer will not save. Shown under their name on the website." }

  - name: "pricing"
    label: "💳 Membership Pricing"
    label_singular: "Tier"
    description: "The membership cards on the Become a Member page."
    files:
      - file: "content/pricing.json"
        label: "💳 Membership Tiers"
        name: "pricing"
        fields:
          - label: "Tiers"
            name: "tiers"
            widget: "list"
            summary: "🏷️ {{name}} · {{priceDisplay}}"
            fields:
              - { label: "🏷️ Tier name", name: "name", widget: "string" }
              - { label: "💬 Badge text (small label above the tier name)", name: "badgeLabel", widget: "string", hint: "e.g. 'Most Popular', 'Individual', 'Student'" }
              - { label: "🎨 Badge colour", name: "badgeStyle", widget: "select", options: [{ label: "⚪ Grey (Student / pending)", value: "student" }, { label: "🩵 Teal (Individual)", value: "entry" }, { label: "🟢 Green (Most Popular)", value: "popular" }, { label: "🔵 Sky Blue (Thought Leader)", value: "leader" }, { label: "🟦 Blue (Partner)", value: "enterprise" }] }
              - { label: "💲 Price type", name: "priceMode", widget: "select", options: [{ label: "💲 Show a dollar price", value: "amount" }, { label: "✉️ Show 'Contact us'", value: "contact" }, { label: "⏳ Show 'Price TBC'", value: "tbc" }] }
              - { label: "💲 Price (only if price type = dollar price)", name: "priceDisplay", widget: "string", required: false, hint: "Just the number, e.g. 99 or 1,650 - no dollar sign" }
              - { label: "🗓️ Billing period line", name: "period", widget: "string", hint: "e.g. 'Annual membership • Billed once a year'" }
              - { label: "📝 Description", name: "description", widget: "text" }
              - { label: "✅ What's included (features list)", name: "features", widget: "list", field: { label: "✅ Feature", name: "feature", widget: "string" } }
              - { label: "✨ Highlight this tier (adds the green glow)", name: "featured", widget: "boolean", default: false }
              - { label: "🔘 Button text", name: "ctaLabel", widget: "string", hint: "e.g. 'Join for $99/yr' or 'Get in touch'" }
              - { label: "🔘 Button action", name: "ctaType", widget: "select", options: [{ label: "➡️ Sends to the registration form", value: "join" }, { label: "✉️ Opens an email", value: "mailto" }, { label: "🚫 Greyed out / disabled (use for 'Price TBC')", value: "disabled" }] }
              - { label: "✉️ Email address (only if button action = opens an email)", name: "ctaTarget", widget: "string", required: false, hint: "e.g. info@sctechia.com.au?subject=Enquiry" }
              - { label: "⚙️ Internal ID - advanced, leave as is", name: "id", widget: "string", hint: "This links the button to the right sign-up form. Only change it if Bart says so." }

  - name: "members"
    label: "🏢 Member Logos"
    label_singular: "Member logo"
    description: "The scrolling logo band on the homepage. Add a logo when a member joins, remove it when they leave."
    files:
      - file: "content/members.json"
        label: "🏢 Member & Partner Logos"
        name: "members"
        fields:
          - label: "Members"
            name: "members"
            widget: "list"
            summary: "🏢 {{name}}"
            fields:
              - { label: "🏢 Organisation name", name: "name", widget: "string", hint: "Shown to screen readers and used if the image fails to load" }
              - { label: "🖼️ Logo image", name: "logo", widget: "image", hint: "PNG or SVG with a transparent background works best. The logo sits on a white tile." }
              - { label: "📏 Display size", name: "size", widget: "select", default: "standard", options: [{ label: "Standard", value: "standard" }, { label: "Large (for logos with lots of space around the mark)", value: "large" }] }
              - { label: "🌑 Darken the logo", name: "darken", widget: "boolean", default: false, hint: "Turn this on for pale or white logos that would otherwise disappear against the white tile" }

  - name: "faq"
    label: "❓ Common Questions"
    label_singular: "Question"
    description: "The Common questions section at the bottom of the Become a Member page."
    files:
      - file: "content/faq.json"
        label: "❓ Common Questions"
        name: "faq"
        fields:
          - label: "Questions"
            name: "faqs"
            widget: "list"
            summary: "❓ {{question}}"
            fields:
              - { label: "❓ Question", name: "question", widget: "string" }
              - { label: "💬 Answer", name: "answer", widget: "text", hint: "Plain text. Keep it to a paragraph so the answer opens cleanly." }

  - name: "photos"
    label: "📸 Event Photos"
    label_singular: "Photo"
    description: "Photos from past events, shown on the homepage, the Become a Member page and the About section."
    files:
      - file: "content/photos.json"
        label: "📸 Event Photos"
        name: "photos"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "📸 {{alt}} ({{placement}})"
            fields:
              - { label: "📸 Photo", name: "image", widget: "image", hint: "Landscape photos work best. Very large files will slow the page down, so keep them under about 500KB." }
              - { label: "📝 Description of the photo", name: "alt", widget: "string", hint: "A short description of what is happening, read aloud to people using a screen reader. For example 'Members talking at a Barside Natter evening'." }
              - { label: "📍 Where it appears", name: "placement", widget: "select", default: "homepage", options: [{ label: "🏠 Homepage band (uses the first 5)", value: "homepage" }, { label: "💳 Become a Member page (uses the first 3)", value: "join" }, { label: "ℹ️ About section (uses the first 1)", value: "about" }], hint: "To show the same photo in two places, add it twice and give each entry a different location." }
